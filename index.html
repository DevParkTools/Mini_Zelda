#dpad .u{top:7%;left:50%;transform:translateX(-50%)}
#dpad .d{bottom:7%;left:50%;transform:translateX(-50%)}
#dpad .l{left:9%;top:50%;transform:translateY(-50%)}
#dpad .r{right:9%;top:50%;transform:translateY(-50%)}
#acts{display:grid;grid-template-columns:repeat(2,var(--bd));grid-template-rows:repeat(2,var(--bd));gap:calc(var(--bd)*.14)}
#acts button{width:var(--bd);height:var(--bd);border-radius:50%;background:rgba(255,255,255,.1);color:#fff;border:2px solid rgba(255,255,255,.32);font-size:calc(var(--bd)*.22);touch-action:none;padding:0}
#acts button[data-k=e]{display:none}
#acts.bow{grid-template-columns:repeat(3,calc(var(--bd)*.82));grid-template-rows:repeat(2,calc(var(--bd)*.82))}
#acts.bow button{width:calc(var(--bd)*.82);height:calc(var(--bd)*.82)}
#acts.bow button[data-k=e]{display:block}
#acts button.on{background:rgba(255,255,255,.32)}

.pad{display:flex}
#hint{display:none}
}
@media (pointer:coarse) and (orientation:landscape){
:root{--pd:min(26vw,64vh,190px);--bd:min(11vw,26vh,78px)}

.pad{display:flex}
#hint{display:none}
}

#volRow{display:flex;flex-direction:column;gap:4px;color:#fff;font-size:clamp(13px,3.2vmin,20px);text-align:center}

#volRow input{width:100%;touch-action:pan-x}

#end{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:flex-start;gap:clamp(8px,2.4vmin,22px);background:rgba(8,8,36,.94);color:#fff;text-align:center;font-size:clamp(13px,3.4vmin,22px);line-height:1.55;white-space:pre-line;z-index:6;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:max(14px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(14px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
#end #endText{max-width:min(92vw,620px);margin-top:auto}

@media (max-height:430px){

if(SOLID[id]||npcAt(nx,ny))return;
const b=blockAt(nx,ny);
if(b){if(!b.moving)P.bump=b;return}
if(enemyAt(nx,ny,null)||bossOcc(nx,ny))return;
startMove(nx,ny,S.hp<4?.19:.15);
}

function doPush(b,d){
const nx=b.tx+DX[d],ny=b.ty+DY[d];
if(!free(nx,ny)||enemyAt(nx,ny,null)||bossOcc(nx,ny))return;
if(cur.tiles[ny*COLS+nx]===16)return;
b.fx=b.tx;b.fy=b.ty;b.tx=nx;b.ty=ny;b.mt=0;b.moving=true;
startMove(P.tx+DX[d],P.ty+DY[d],.15);
beep(140,.12,'triangle');
}

function checkSwitches(){
if(cur.solved)return;
const t=cur.tiles;
let n=0;
for(let i=0;i<t.length;i++)if(t[i]===15){n++;if(!blockAt(i%COLS,(i/COLS)|0))return}
if(!n)return;
cur.solved=true;
if(cur===rooms.d1)flags.gate=true;
toast('비밀을 풀었다! 철창이 올라간다');
openTiles(16,'#b39ddb',true);
}

function checkShutters(){
if(!cur.shut||cur.cleared)return;
const en=cur.enemies;
for(let i=0;i<en.length;i++)if(en[i].alive)return;
cur.cleared=true;
toast('철창이 열렸다!');
openTiles(19,'#ef5350',false);
}

function checkExit(){
const ex=cur.exits;
for(let i=0;i<ex.length;i++){
const e=ex[i];
if(e.x!==P.tx||e.y!==P.ty)continue;
if(e.need&&!flags[e.need]){
say(['(밖은 위험하다. 방 안의 상자를 먼저 살펴보자.)']);
setPlayerTile(P.tx,P.ty-1);
return;
}
if(e.lock==='boss'&&flags.bossFight&&!flags.bossDead){
toast('문이 굳게 닫혀 있다!');
setPlayerTile(P.tx,P.ty-1);
return;
}
fd.t=0;fd.ph=0;fd.e=e;mode='fade';
return;
}
}

function arrive(){
collectPickups();
if(cur.tiles[P.ty*COLS+P.tx]===6)checkExit();
}

function damageEnemy(e,dmg,sx,sy){
e.hp-=dmg;e.hit=.25;
if(e.type==='K'){e.stun=Math.min(e.stun,.1)}else{e.stun=.4;e.atk=0;e.cd=.6}
beep(240,.08,'sawtooth');
if(hs<.04)hs=.04;
const dead=e.hp<=0;
burst(e.x+8,e.y+8,dead?16:6,e.type==='b'?'#bdbdbd':e.type==='s'?'#b39ddb':e.type==='K'?'#ef5350':'#ffcc80',dead?95:60);
if(dead){
e.alive=false;
dropFrom(e.tx,e.ty,e.type==='K');
if(e.type==='K'){shk=4;hs=.14;toast('기사를 쓰러뜨렸다!')}
checkShutters();
return;
}
if(!e.moving&&e.type!=='K'){
const dx=e.x+8-sx,dy=e.y+8-sy;
const d=Math.abs(dx)>=Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);

function aiStep(e){
const dx=P.tx-e.tx,dy=P.ty-e.ty;
const rng=e.type==='K'?20:e.type==='k'?7:6,pr=e.type==='K'?.95:e.type==='k'?.75:.6;
let d;
if(Math.abs(dx)+Math.abs(dy)<=rng&&Math.random()<pr)d=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
else d=(Math.random()*4)|0;
const nx=e.tx+DX[d],ny=e.ty+DY[d];
if(free(nx,ny)&&!enemyAt(nx,ny,e)&&!bossOcc(nx,ny)&&!playerOcc(nx,ny)){
e.fx=e.tx;e.fy=e.ty;e.tx=nx;e.ty=ny;e.mt=0;e.moving=true;
e.step=e.type==='b'?.2:e.type==='k'?.42:e.type==='K'?.34:.38;
e.c=e.type==='b'?.05+Math.random()*.2:e.type==='k'?.3+Math.random()*.4:e.type==='K'?.2+Math.random()*.3:.4+Math.random()*.6;
}else e.c=.2;
}

function updateEnemies(dt){
const en=cur.enemies;
for(let i=0;i<en.length;i++){
const e=en[i];
if(!e.alive)continue;
if(e.hit>0)e.hit-=dt;
if(e.cd>0)e.cd-=dt;
if(e.moving){
e.mt+=dt/e.step;
if(e.mt>=1){e.mt=1;e.moving=false}
e.x=(e.fx+(e.tx-e.fx)*e.mt)*T;
e.y=(e.fy+(e.ty-e.fy)*e.mt)*T;
}else if(e.stun>0)e.stun-=dt;
else if(e.atk>0){
e.atk-=dt;
if(!e.dealt&&e.atk<=e.aT*.4){
e.dealt=true;
const ax=e.tx+DX[e.ad],ay=e.ty+DY[e.ad],L=e.type==='K'?2:1;
if(P.inv<=0&&ov(P.x+3,P.y+3,10,10,Math.min(ax,ax+DX[e.ad]*(L-1))*T+2,Math.min(ay,ay+DY[e.ad]*(L-1))*T+2,12+(DX[e.ad]?(L-1)*T:0),12+(DY[e.ad]?(L-1)*T:0))){
hurt(e.x+8,e.y+8,e.type==='K'?2:1);
if(mode!=='play')return;
}
}
if(e.atk<=0){e.atk=0;e.cd=(e.type==='K'?.5:.8)+Math.random()*.4}
}else{
const dx=P.tx-e.tx,dy=P.ty-e.ty,md=Math.abs(dx)+Math.abs(dy);
const reach=md===1||(e.type==='K'&&md===2&&(dx===0||dy===0));
if(e.cd<=0&&reach){
e.ad=dy<0?0:dy>0?2:dx>0?1:3;
e.aT=e.type==='K'?.6:e.type==='b'?.38:.5;
e.atk=e.aT;
e.dealt=false;
beep(e.type==='K'?200:330,.05,'square');
}else{
e.c-=dt;
if(e.c<=0)aiStep(e);
}
}
}
}

if(lockCd>0)lockCd-=dt;

P.att-=dt;

if(!P.moving){arrive();if(mode!=='play')return}
}
if(!P.moving){

else if(actC)placeBomb();
else if(actD)usePotion();
if(mode!=='play')return;
collectPickups();
}
if(actA&&flags.sword&&P.att<=0)swordAttack();
if(actE&&hasBow)fireArrow();

}else P.pushT=0;
}
}

}

}

tPlay+=dt;

const f=fxs[i],k=1-f.t/.35,cx=f.tx*T+8,cy=f.ty*T+8,r=8+k*16;
ctx.fillStyle='rgba(255,152,0,'+(f.t/.35*.8)+')';
ctx.fillRect(cx-r,cy-r,r*2,r*2);
ctx.fillStyle='rgba(255,235,59,'+(f.t/.35)+')';
ctx.fillRect(cx-r*.6,cy-r*.6,r*1.2,r*1.2);
}
}

function drawParts(){
for(let i=0;i<PARTS.length;i++){
const p=PARTS[i];
if(!p.on)continue;
ctx.globalAlpha=Math.min(1,p.t/p.m*1.6);
ctx.fillStyle=p.c;
ctx.fillRect(R(p.x),R(p.y),p.s,p.s);
}
ctx.globalAlpha=1;
}

function drawNum(n,d,x,y){
for(let i=d-1;i>=0;i--){
const k=n%10;
n=(n-k)/10;
ctx.drawImage(atlas,k*7,0,7,9,x+i*6,y,7,9);
}
}
function drawIcon(i,x,y){ctx.drawImage(IC,i*12,0,12,12,x,y,12,12)}

function drawHud(){
ctx.fillStyle='rgba(0,0,0,.55)';
ctx.fillRect(2,2,hasBow?130:108,15);
drawIcon(0,4,3);drawNum(S.coins,3,17,5);
drawIcon(1,38,3);drawNum(S.bombs,2,51,5);
drawIcon(2,66,3);drawNum(S.keys,1,78,5);
drawIcon(3,88,3);drawNum(S.potions,1,100,5);
if(hasBow){
ctx.fillStyle='#8d6e63';ctx.fillRect(111,9,8,2);
ctx.fillStyle='#eceff1';ctx.fillRect(119,8,2,4);
ctx.fillStyle='#ef5350';ctx.fillRect(110,8,1,4);
drawNum(S.arrows,2,122,5);
}
ctx.fillStyle='rgba(0,0,0,.55)';
ctx.fillRect(144,2,88,23);
ctx.drawImage(atlas,GL_L*7,0,7,9,176,3,7,9);
ctx.drawImage(atlas,GL_I*7,0,7,9,182,3,7,9);
ctx.drawImage(atlas,GL_F*7,0,7,9,188,3,7,9);
ctx.drawImage(atlas,GL_E*7,0,7,9,194,3,7,9);
const n=S.max>>1,low=S.hp>0&&S.hp<4,last=low?((S.hp+1)>>1)-1:-1;
for(let i=0;i<n;i++){
if(i===last)continue;
const u=S.hp-i*2;
drawIcon(u>=2?4:u===1?6:5,146+i*10,12);
}
if(last>=0){
const u=S.hp-last*2,ic=u>=2?4:6,k=beatK(lowT>0?1-lowT/LOWP:0),sz=12+2*Math.round(k*2),o=(sz-12)>>1;
ctx.drawImage(IC,ic*12,0,12,12,146+last*10-o,12-o,sz,sz);
}
drawBossBar();
}

function covered(r,tx,ty){
const b=r.blocks;
for(let i=0;i<b.length;i++)if(b[i].tx===tx&&b[i].ty===ty)return true;
return false;
}

function drawAnim(r,ox,oy){
const a=r.an;
for(let i=0;i<a.length;i+=3){
const x=a[i]+ox,y=a[i+1]+oy,id=a[i+2];
if(x<-T||y<-T||x>W||y>H)continue;
if(id===4){
const ph=((gt*3+a[i]*.37+a[i+1]*.21)|0)&3;
ctx.fillStyle='rgba(255,255,255,.7)';
if(ph===0)ctx.fillRect(x+3,y+5,3,1);
else if(ph===1)ctx.fillRect(x+9,y+10,3,1);
else if(ph===2)ctx.fillRect(x+11,y+3,2,1);
}else if(id===31){
const f=((gt*12+a[i])|0)&3;
ctx.fillStyle='rgba(255,170,60,.10)';ctx.fillRect(x-10,y-8,36,32);
ctx.fillStyle='#e65100';ctx.fillRect(x+6,y+3-(f&1),4,6+(f&1));
ctx.fillStyle='#ff9800';ctx.fillRect(x+7,y+3-(f&1),2,5+(f&1));
ctx.fillStyle='#ffee58';ctx.fillRect(x+7,y+5-(f&1),2,3);
}else if(id===32){
const f=((gt*8)|0)&3;
ctx.fillStyle='#e1f5fe';ctx.fillRect(x+7,y+2+f,2,2);ctx.fillRect(x+5+f,y+6,1,1);ctx.fillRect(x+10-f,y+7,1,1);
}else if(id===35&&!r.solved){
if(((gt*4+a[i]*.1)|0)&1){ctx.fillStyle='#ffffff';ctx.fillRect(x+7,y+4,2,2);ctx.fillRect(x+3,y+7,1,1);ctx.fillRect(x+12,y+3,1,1)}
}else if(id===15&&!r.solved&&!covered(r,a[i]/T,a[i+1]/T)){
if(Math.sin(gt*5)>0){
ctx.fillStyle='#e8eaf6';
ctx.fillRect(x+1,y+1,4,1);ctx.fillRect(x+1,y+1,1,4);
ctx.fillRect(x+11,y+1,4,1);ctx.fillRect(x+14,y+1,1,4);
ctx.fillRect(x+1,y+14,4,1);ctx.fillRect(x+1,y+11,1,4);
ctx.fillRect(x+11,y+14,4,1);ctx.fillRect(x+14,y+11,1,4);
}
}
}
}

function drawRoom(r,ox,oy,ents){
ox=R(ox);oy=R(oy);
if(r.dirty)redraw(r);
ctx.drawImage(r.cache,ox,oy);
drawAnim(r,ox,oy);
drawEntities(r,ox,oy,ents);
if(opt.grid)ctx.drawImage(gridCv,ox,oy);
}

function drawLabels(r,ox,oy){
const L=r.labels;
if(!L.length)return;
const s=cv.width/W;
dctx.font='bold '+(7*s)+'px sans-serif';
dctx.textAlign='center';
dctx.textBaseline='middle';
for(let i=0;i<L.length;i++){
const l=L[i],w=(l.t.length*8+6)*s,cx=(l.x+ox)*s,cy=(l.y+oy)*s;
dctx.fillStyle='rgba(0,0,0,.6)';
dctx.fillRect(cx-w/2-s,cy-5.5*s,w+2*s,11*s);
dctx.fillStyle=l.c;
dctx.fillRect(cx-w/2,cy-4.5*s,w,9*s);
dctx.fillStyle='rgba(255,255,255,.35)';
dctx.fillRect(cx-w/2,cy-4.5*s,w,s);
dctx.fillStyle='#fff';
dctx.fillText(l.t,cx,cy+.5*s);
}
}

function render(){
ctx.fillStyle='#000';
ctx.fillRect(0,0,W,H);
let sx=0,sy=0;
if(shk>0){sx=((Math.random()*2-1)*shk)|0;sy=((Math.random()*2-1)*shk)|0}
ctx.save();
ctx.translate(sx,sy);
if(mode==='slide'){
const d=sl.d,t=sl.t,cx=DX[d]*W*t,cy=DY[d]*H*t;
drawRoom(sl.from,-cx,-cy);
drawRoom(sl.to,DX[d]*W-cx,DY[d]*H-cy,false);
drawPlayer(R(sl.px+(sl.tx*T+DX[d]*W-sl.px)*t-cx),R(sl.py+(sl.ty*T+DY[d]*H-sl.py)*t-cy));
}else{
drawRoom(cur,0,0);
drawBombs();
drawBoss();
drawOrbs();
drawArrows();
if(mode==='cine'){
const k=cine.t/cine.m,r=(1-k)*70;
ctx.fillStyle='rgba(0,0,0,'+Math.min(.45,(1-k)*2)*1+')';ctx.fillRect(0,0,W,H);
ctx.strokeStyle=cine.col;ctx.lineWidth=2;ctx.globalAlpha=Math.min(1,k*2);ctx.strokeRect(R(cine.x-r/2),R(cine.y-r/2),R(r),R(r));ctx.globalAlpha=1;
ctx.fillStyle=cine.col;ctx.globalAlpha=Math.max(0,k-.6)*.8;ctx.fillRect(R(cine.x-8),0,16,H);ctx.globalAlpha=1;
}
if(ig){ctx.fillStyle='rgba(0,0,0,'+Math.min(.5,ig.t*1.2)+')';ctx.fillRect(0,0,W,H)}
if(!flags.asleep){
drawPlayer(R(P.x),R(P.y));
if(opt.grid&&mode==='play'&&!P.moving)drawCursor();
}
drawParts();
}
ctx.restore();
if(cur.kind==='out'&&!flags.dawn){ctx.fillStyle='rgba(10,10,70,.38)';ctx.fillRect(0,0,W,H)}
else if(cur.kind==='dun'){ctx.fillStyle='rgba(0,0,20,.18)';ctx.fillRect(0,0,W,H)}
if(B.flash>.22){ctx.fillStyle='rgba(255,255,255,.4)';ctx.fillRect(0,0,W,H)}
if(mode==='fade'){
ctx.fillStyle='rgba(0,0,0,'+(fd.ph===0?fd.t:1-fd.t)+')';
ctx.fillRect(0,0,W,H);
}
if(mode==='intro'){
ctx.fillStyle='rgba(0,0,0,'+Math.max(0,Math.min(1,introT/introMax))+')';
ctx.fillRect(0,0,W,H);
}
if(mode==='over'){
ctx.fillStyle='rgba(0,0,0,'+Math.max(0,Math.min(1,(2.4-overT-.6)/1.4))+')';
ctx.fillRect(0,0,W,H);
}
drawHud();
dctx.imageSmoothingEnabled=false;
dctx.drawImage(bcv,0,0,cv.width,cv.height);
if(mode==='slide'){
const d=sl.d,t=sl.t,cx=DX[d]*W*t,cy=DY[d]*H*t;
drawLabels(sl.from,-cx,-cy);
drawLabels(sl.to,DX[d]*W-cx,DY[d]*H-cy);
}else if(mode!=='fade'&&mode!=='intro'&&mode!=='over')drawLabels(cur,0,0);
}

function labels(){
bGrid.textContent='격자 표시: '+(opt.grid?'켜짐':'꺼짐');
bSnd.textContent='소리: '+(opt.snd?'켜짐':'꺼짐');
bBgm.textContent='배경음악: '+(opt.bgm?'켜짐':'꺼짐');
volEl.value=opt.vol;volVal.textContent=opt.vol+'%';
bFS.textContent='전체 화면: '+(document.fullscreenElement?'끄기':'켜기');
bWipe.textContent=armedW?'정말 삭제할까요? 한 번 더 누르세요':'저장 데이터 삭제';
bRestart.textContent=armed?'정말 재시작할까요? 한 번 더 누르세요':'재시작';
}
function openSettings(){
if(mode==='paused'||mode==='end')return;
prevMode=mode;
mode='paused';
held.fill(0);
armed=false;armedW=false;
labels();
settingsEl.style.display='flex';
}
function closeSettings(){
settingsEl.style.display='none';
armed=false;armedW=false;
if(mode==='paused')mode=prevMode;
}
gearEl.addEventListener('click',openSettings);
bClose.addEventListener('click',closeSettings);
bGrid.addEventListener('click',()=>{opt.grid=!opt.grid;saveOpt();labels()});
bSnd.addEventListener('click',()=>{opt.snd=!opt.snd;saveOpt();labels()});
volEl.addEventListener('input',()=>{opt.vol=+volEl.value;volVal.textContent=opt.vol+'%';if(outG)outG.gain.value=opt.vol/100;saveOpt()});
volEl.addEventListener('change',()=>{ensureAudio();beep(660,.1)});
bBgm.addEventListener('click',()=>{opt.bgm=!opt.bgm;mCur=null;saveOpt();labels()});
const canFS=!!(document.documentElement&&document.documentElement.requestFullscreen);
function toggleFS(){
if(document.fullscreenElement){document.exitFullscreen()}
else{
const p=document.documentElement.requestFullscreen();
if(p&&p.catch)p.catch(()=>{});
}
}
if(canFS){
bFS.addEventListener('click',toggleFS);
document.addEventListener('fullscreenchange',labels);
}else bFS.style.display='none';
bRestart.addEventListener('click',()=>{
if(armed){try{localStorage.removeItem('zs_run')}catch(e){}location.reload();return}
armed=true;armedW=false;
labels();
});
bWipe.addEventListener('click',()=>{
if(armedW){try{localStorage.removeItem('zs_run');localStorage.removeItem('zs_save')}catch(e){}location.reload();return}
armedW=true;armed=false;
labels();
});
document.getElementById('endBtn').addEventListener('click',()=>{location.reload()});

const KM={ArrowUp:0,KeyW:0,ArrowRight:1,KeyD:1,ArrowDown:2,KeyS:2,ArrowLeft:3,KeyA:3};
addEventListener('keydown',e=>{
ensureAudio();
if(e.code==='Escape'){
if(mode==='paused')closeSettings();else openSettings();
e.preventDefault();
return;
}
const k=KM[e.code];
if(k!==undefined){
held[k]=1;lastDir=k;
if(!e.repeat){if(k===0)tapUp=true;else if(k===2)tapDown=true}
e.preventDefault();
return;
}
if(e.repeat)return;
if(e.code==='KeyZ'||e.code==='Space'){actA=true;e.preventDefault()}
else if(e.code==='KeyX'||e.code==='Enter'){actB=true;e.preventDefault()}
else if(e.code==='KeyC'){actC=true}
else if(e.code==='KeyV'){actD=true}
else if(e.code==='KeyB'){actE=true}
else if(e.code==='KeyF'&&canFS)toggleFS();
});
addEventListener('keyup',e=>{
const k=KM[e.code];
if(k!==undefined)held[k]=0;
});
addEventListener('blur',()=>{held.fill(0)});
addEventListener('pointerdown',ensureAudio);
addEventListener('contextmenu',e=>{e.preventDefault()});

const dp=document.getElementById('dpad');
let dpDown=false;
function dpSet(e){
const r=dp.getBoundingClientRect();
const dx=e.clientX-(r.left+r.width/2),dy=e.clientY-(r.top+r.height/2);
held.fill(0);
if(Math.abs(dx)+Math.abs(dy)<r.width*.1)return;
const i=Math.abs(dx)>Math.abs(dy)?(dx>0?1:3):(dy>0?2:0);
held[i]=1;
if(lastDir!==i){
lastDir=i;
if(i===0)tapUp=true;else if(i===2)tapDown=true;
}
}
dp.addEventListener('pointerdown',e=>{e.preventDefault();dpDown=true;dp.setPointerCapture(e.pointerId);dpSet(e)});
dp.addEventListener('pointermove',e=>{if(dpDown)dpSet(e)});
['pointerup','pointercancel'].forEach(n=>dp.addEventListener(n,()=>{dpDown=false;held.fill(0);lastDir=-1}));

document.querySelectorAll('#acts button').forEach(b=>{
const k=b.dataset.k;
b.addEventListener('pointerdown',e=>{
e.preventDefault();
b.classList.add('on');
if(k==='a')actA=true;else if(k==='b')actB=true;else if(k==='c')actC=true;else if(k==='e')actE=true;else actD=true;
});
['pointerup','pointercancel','pointerleave'].forEach(n=>b.addEventListener(n,()=>b.classList.remove('on')));
});
wrap.addEventListener('pointerdown',()=>{if(mode==='dialog'||mode==='menu')actB=true});

fit();
if(window.ResizeObserver)new ResizeObserver(fit).observe(stage);
addEventListener('resize',fit);
addEventListener('load',fit);

let last=performance.now();
function frame(ts){
const dt=Math.min((ts-last)/1000,.05);
last=ts;
gt+=dt;
update(dt);
render();
actA=false;actB=false;actC=false;actD=false;actE=false;tapUp=false;tapDown=false;
requestAnimationFrame(frame);
}
refreshBow();
if(!loadRun())enterRoom(rooms.house,4,3,2);
requestAnimationFrame(frame);
</script>
</body>
</html>
